<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Graffl einstellen | GrafflKathl</title>
</head>

<body>

    <h1>GrafflKathl</h1>
    <h2>Graffl einstellen</h2>

    <form method="POST">

        <label for="name">Name:</label>
        <br>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <br><br>

        <label for="beschreibung">Beschreibung:</label>
        <br>
        <textarea
            id="beschreibung"
            name="beschreibung"
            rows="4"
        ></textarea>

        <br><br>

        <label for="kategorie">Kategorie:</label>
        <br>

        <select id="kategorie" name="kategorie" required>
            <option value="">Kategorie auswählen</option>
            <option value="Werkzeug">Werkzeug</option>
            <option value="Garten">Garten</option>
            <option value="Küche & Haushalt">Küche & Haushalt</option>
            <option value="Freizeit & Sport">Freizeit & Sport</option>
            <option value="Elektronik">Elektronik</option>
            <option value="Sonstiges">Sonstiges</option>
        </select>

        <br><br>

        <button type="submit">
            Graffl einstellen
        </button>

    </form>

    <br>

    <a href="/gegenstaende">
        Zur Graffl-Übersicht
    </a>

    <br><br>

    <a href="/profil">
        Mein Profil
    </a>

</body>
</html>
